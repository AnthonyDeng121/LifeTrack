spring:
  profiles:
    active: dev
  application:
    name: LifeTrack

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 统一管理 Jackson 配置
jackson:
  date-format: yyyy-MM-dd HH:mm:ss
  time-zone: GMT+8

# JWT 配置
jwt:
  secret: life-track-ai-secret-key-2024-05-23-very-long-key
  expiration: 86400000 # 24小时

# AI 配置 (由李想/魏欣岳填充)
openai:
  api-key: ${OPENAI_API_KEY:sk-xxx} # 建议通过环境变量注入
  api-url: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini
