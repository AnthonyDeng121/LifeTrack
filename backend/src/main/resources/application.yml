spring:
  application:
    name: LifeTrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lifetrack?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: Consolidated schema baseline
    clean-disabled: true
    validate-migration-naming: true

server:
  port: 8081

auth:
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:false}
  demo-phone-enabled: ${AUTH_DEMO_PHONE_ENABLED:false}
  demo-code: ${AUTH_DEMO_CODE:123456}

# 不让框架调试日志输出认证请求、响应或学习记录正文。
logging:
  level:
    org.springframework.web: INFO
    org.springframework.http: INFO

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24小时

# Python AI 服务使用智谱 GLM，模型与密钥由 AI_Server 环境变量配置。
ai:
  base-url: ${AI_BASE_URL:http://127.0.0.1:5000/ai}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:40}
