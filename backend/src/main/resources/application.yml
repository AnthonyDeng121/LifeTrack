spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: LifeTrack

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 统一管理 Jackson 配置
jackson:
  date-format: yyyy-MM-dd HH:mm:ss
  time-zone: GMT+8

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24小时

# Python AI 服务使用智谱 GLM，模型与密钥由 AI_Server 环境变量配置。
ai:
  base-url: ${AI_BASE_URL:http://127.0.0.1:5000/ai}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:40}
