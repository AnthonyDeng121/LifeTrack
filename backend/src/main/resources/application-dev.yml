server:
  port: 8081

auth:
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:true}
  demo-phone-enabled: ${AUTH_DEMO_PHONE_ENABLED:true}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lifetrack?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

# 日志配置
logging:
  level:
    com.lifetrack: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
