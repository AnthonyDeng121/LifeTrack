spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lifetrack?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: test-only-jwt-secret-at-least-thirty-two-characters-long
  expiration: 86400000
